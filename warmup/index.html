<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Навчальні нотатки</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* ---- Форма ---- */
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 2rem;
    }

    .form-card label {
      display: block;
      font-weight: 600;
      font-size: .875rem;
      margin-bottom: .25rem;
      color: #555;
    }

    .form-card input,
    .form-card textarea {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
      margin-bottom: .75rem;
      transition: border-color .2s;
    }

    .form-card input:focus,
    .form-card textarea:focus {
      outline: none;
      border-color: #0071e3;
    }

    .form-card textarea { resize: vertical; min-height: 90px; }

    .btn-add {
      display: inline-block;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .6rem 1.5rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-add:hover { background: #005bb5; }

    .error-msg {
      color: #d00;
      font-size: .85rem;
      margin-bottom: .5rem;
      display: none;
    }

    /* ---- Список нотаток ---- */
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 2rem 0;
      font-size: 1rem;
    }

    .note-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: .75rem;
      position: relative;
    }

    .note-card .note-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: .25rem;
    }

    .note-card .note-date {
      font-size: .8rem;
      color: #888;
      margin-bottom: .4rem;
    }

    .note-card .note-preview {
      font-size: .9rem;
      color: #444;
      margin-bottom: .5rem;
    }

    .note-card .note-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin-bottom: .25rem;
    }

    .tag-chip {
      background: #e8f0fe;
      color: #1a56db;
      font-size: .75rem;
      font-weight: 600;
      padding: .15rem .55rem;
      border-radius: 999px;
    }

    .btn-delete {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: .3rem .7rem;
      font-size: .8rem;
      color: #888;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }

    .btn-delete:hover {
      color: #d00;
      border-color: #d00;
    }
  </style>
</head>
<body>

  <h1>📝 Навчальні нотатки</h1>

  <!-- Форма -->
  <div class="form-card">
    <form id="noteForm">
      <label for="title">Назва</label>
      <input type="text" id="title" placeholder="Введіть назву нотатки…">
      <p class="error-msg" id="errorMsg">Назва не може бути порожньою</p>

      <label for="text">Текст</label>
      <textarea id="text" placeholder="Текст нотатки…"></textarea>

      <label for="tags">Теги (через кому)</label>
      <input type="text" id="tags" placeholder="python, flask, web">

      <button type="submit" class="btn-add">Додати нотатку</button>
    </form>
  </div>

  <!-- Список -->
  <h2>Збережені нотатки</h2>
  <div id="notesList"></div>

  <script>
    const STORAGE_KEY = 'warmup_notes';

    function loadNotes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveNotes(notes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('uk-UA', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function renderNotes() {
      const list = document.getElementById('notesList');
      const notes = loadNotes();

      if (notes.length === 0) {
        list.innerHTML = '<p class="empty-state">Нотаток поки немає</p>';
        return;
      }

      list.innerHTML = notes.map((n, i) => {
        const preview = n.text.length > 100 ? n.text.slice(0, 100) + '…' : n.text;
        const tagsHtml = n.tags.length
          ? `<div class="note-tags">${n.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>`
          : '';
        return `
          <div class="note-card">
            <button class="btn-delete" onclick="deleteNote(${i})">Видалити</button>
            <div class="note-title">${escapeHtml(n.title)}</div>
            <div class="note-date">${formatDate(n.created)}</div>
            ${tagsHtml}
            <div class="note-preview">${escapeHtml(preview)}</div>
          </div>`;
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function deleteNote(index) {
      if (!confirm('Справді видалити цю нотатку?')) return;
      const notes = loadNotes();
      notes.splice(index, 1);
      saveNotes(notes);
      renderNotes();
    }

    document.getElementById('noteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const titleEl = document.getElementById('title');
      const textEl  = document.getElementById('text');
      const tagsEl  = document.getElementById('tags');
      const errorEl = document.getElementById('errorMsg');

      const title = titleEl.value.trim();
      if (!title) {
        errorEl.style.display = 'block';
        titleEl.focus();
        return;
      }
      errorEl.style.display = 'none';

      const note = {
        title: title,
        text: textEl.value.trim(),
        tags: tagsEl.value.split(',').map(t => t.trim()).filter(Boolean),
        created: new Date().toISOString()
      };

      const notes = loadNotes();
      notes.unshift(note);
      saveNotes(notes);

      titleEl.value = '';
      textEl.value = '';
      tagsEl.value = '';
      renderNotes();
    });

    // Приховати помилку при введенні
    document.getElementById('title').addEventListener('input', function() {
      document.getElementById('errorMsg').style.display = 'none';
    });

    // Початковий рендер
    renderNotes();
  </script>
</body>
</html>
